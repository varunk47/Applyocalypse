[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applyocalypse-automation"
version = "0.1.0"
description = "Applyocalypse local Python worker for browser automation, document processing, and LLM-backed analysis."
requires-python = ">=3.12"
dependencies = [
  "litellm>=1.67.0",
  "nodriver>=0.39",
  "pdf2docx>=0.5.8",
  "python-docx>=1.1.2",
  "TexSoup>=0.3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pyinstaller>=6.13.0"
]

[project.scripts]
applyocalypse-worker = "applyocalypse_automation.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
