appId: com.applyocalypse.desktop
productName: Applyocalypse
directories:
  output: release
  # Where electron-builder looks for build-time assets it does not package,
  # icon.ico among them. It defaults to `build/`, which this app does not have,
  # so pointing it at the folder that already holds this config lets the icon
  # keys below stay bare filenames.
  buildResources: electron-builder
asar: true
# Native rebuilds are handled by scripts/dev/rebuild-native.mjs (prebuild-install
# on better-sqlite3@12 only). electron-builder's own rebuild walks the workspace
# tree and tries to compile the better-sqlite3@11 copy (pinned for Node-ABI
# vitest), which cannot build against Electron >=39 headers.
npmRebuild: false
files:
  - out/**
  - package.json
  # electron-builder always packages production dependencies, and better-sqlite3
  # publishes its entire build tree: an incremental-link object, an incremental
  # PDB, the static sqlite3 lib, the object directory, the amalgamation sources
  # and the C++ sources. Roughly 43 MB of it per copy, of which the only file the
  # app ever opens is build/Release/better_sqlite3.node at 1.7 MB.
  - "!node_modules/**/better-sqlite3/deps/**"
  - "!node_modules/**/better-sqlite3/src/**"
  - "!node_modules/**/better-sqlite3/build/Release/obj/**"
  - "!node_modules/**/better-sqlite3/build/Release/*.iobj"
  - "!node_modules/**/better-sqlite3/build/Release/*.ipdb"
  - "!node_modules/**/better-sqlite3/build/Release/*.lib"
  - "!node_modules/**/better-sqlite3/build/Release/*.exp"
  - "!node_modules/**/better-sqlite3/build/Release/*.ilk"
  # test_extension.node exists so better-sqlite3's own test suite has something to
  # call loadExtension on. Nothing in lib/ references it, and it is only here at all
  # because electron-builder unpacks every *.node it finds.
  - "!node_modules/**/better-sqlite3/build/Release/test_extension.node"
  - "!node_modules/**/better-sqlite3/build/*.vcxproj*"
  - "!node_modules/**/better-sqlite3/build/*.sln"
  - "!node_modules/**/better-sqlite3/build/deps/**"
  # The second copy, better-sqlite3@11, exists only so vitest can load a Node-ABI
  # build; see the pin in packages/db. It is compiled against the wrong ABI for
  # Electron, so the app could never load it and does not: the main process is
  # bundled to one file whose `require("better-sqlite3")` resolves to the
  # top-level Electron-ABI copy. Shipping it was 43 MB of unreachable weight.
  - "!node_modules/@applyocalypse/db/node_modules/better-sqlite3/**"
extraResources:
  - from: ../../services/automation-python/dist/applyocalypse-worker
    to: automation-python
    filter:
      - "**/*"
  - from: ../../packages/db/migrations
    to: migrations
    filter:
      - "**/*.sql"
win:
  # The brand mark, built from landing/assets/favicon.svg by
  # scripts/build/generate-app-icon.mjs. Without it every build printed
  # "default Electron icon is used" and shipped Electron's logo everywhere.
  icon: icon.ico
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  # This flag gates signing and executable resource editing together, and there
  # is no code signing certificate yet. Turning it on makes electron-builder
  # fetch a toolchain whose archive holds macOS dylib symlinks; creating those
  # needs a privilege Windows withholds outside Developer Mode, so the download
  # fails and takes the build with it. scripts/build/after-pack.cjs writes the
  # icon and version strings into the exe instead. Revisit once a certificate
  # exists and the signing half is actually wanted.
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: Applyocalypse
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
afterPack: ../../scripts/build/after-pack.cjs
afterSign: ../../scripts/build/after-sign.cjs
