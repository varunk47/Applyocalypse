name: Applyocalypse Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so its `cache: pnpm` can locate the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/automation-python/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm native:rebuild

      - name: Package and run packaged smoke suites
        run: pnpm verify:packaged
        env:
          WINDOWS_SIGNTOOL_PATH: ${{ secrets.WINDOWS_SIGNTOOL_PATH }}
          WINDOWS_CERT_SHA1: ${{ secrets.WINDOWS_CERT_SHA1 }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          # Enforce signing only when a certificate is configured; unsigned
          # builds stay draft-only and never ship auto-updates.
          APPLYO_REQUIRE_CODE_SIGNING: ${{ secrets.WINDOWS_CERT_SHA1 != '' && '1' || '' }}

      - name: Release preflight report
        run: pnpm release:preflight
        env:
          WINDOWS_SIGNTOOL_PATH: ${{ secrets.WINDOWS_SIGNTOOL_PATH }}
          WINDOWS_CERT_SHA1: ${{ secrets.WINDOWS_CERT_SHA1 }}
          APPLYO_REQUIRE_RELEASE_READY: ${{ secrets.WINDOWS_CERT_SHA1 != '' && '1' || '' }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: applyocalypse-windows-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  mac:
    # PyInstaller only builds the worker for the machine it runs on, so each
    # arch needs its own runner: Apple Silicon on macos-latest, Intel on the
    # Intel image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so its `cache: pnpm` can locate the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/automation-python/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        run: pnpm native:rebuild

      # Until the MAC_CSC_* secrets exist the app is ad-hoc signed on arm64,
      # unsigned on Intel, and not notarized. Setting them signs with the
      # Developer ID under the hardened runtime (scripts/build/mac-signing.mjs);
      # the APPLE_* secrets add notarization. See docs/release-readiness.md.
      - name: Package and run packaged smoke suites
        run: pnpm verify:packaged
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Release preflight report
        run: pnpm release:preflight
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: applyocalypse-mac-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(artifacts/*/*.exe artifacts/*/*.dmg artifacts/*/*.zip)
          gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --title "Applyocalypse $RELEASE_TAG" --generate-notes
