name: Applyocalypse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      # A Mac failure should not hide whether Windows passed, or the reverse.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so its `cache: pnpm` can locate the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/automation-python/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify:functional

      # Known-red: transitive advisories via the dev toolchain (see CLAUDE.md gotchas).
      # Non-blocking so it cannot mask the functional gates, Coverage, or Preflight.
      - name: Dependency audit (non-blocking)
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Coverage
        run: pnpm test:coverage

      - name: Release preflight report
        run: pnpm release:preflight
